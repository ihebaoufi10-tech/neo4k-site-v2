<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - Neo 4K Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #FACC15;
            --text: #FFFFFF;
            --text-dim: #A1A1AA;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .card { background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid #3F3F46; max-width: 500px; width: 100%; }
        .icon { font-size: 60px; color: #22c55e; margin-bottom: 20px; }
        h1 { font-size: 28px; margin-bottom: 10px; color: var(--primary); }
        p { color: var(--text-dim); margin-bottom: 30px; }
        .btn { display: inline-block; background: #25D366; color: white; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-weight: 700; transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Paiement Réussi !</h1>
        <p>Merci pour votre confiance. Votre commande est en cours de traitement.</p>
        <p>Veuillez cliquer sur le bouton ci-dessous pour envoyer votre reçu sur WhatsApp et recevoir votre code d'accès.</p>
        <a href="#" id="waLink" class="btn">Continuer sur WhatsApp</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const whatsapp = urlParams.get('whatsapp');
        const plan = urlParams.get('plan');
        const sessionId = urlParams.get('session_id');

        const message = encodeURIComponent(
            `Bonjour Neo 4K Pro,\n\n` +
            `J'ai effectué mon paiement par carte :\n` +
            `- Plan : ${plan}\n` +
            `- Email : ${email}\n` +
            `- WhatsApp : ${whatsapp}\n` +
            `- Session ID : ${sessionId}\n\n` +
            `Veuillez m'envoyer mon code d'accès.`
        );

        document.getElementById('waLink').href = `https://wa.me/213564653328?text=${message}`;
    </script>
</body>
</html>
