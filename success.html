<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi — Neo 4K Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #FACC15;
            --text: #FFFFFF;
            --text-dim: #A1A1AA;
            --green: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .success-card { background: var(--surface); padding: 50px 30px; border-radius: 30px; border: 1px solid #3F3F46; max-width: 500px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .icon-box { width: 80px; height: 80px; background: rgba(34, 197, 94, 0.1); color: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 15px; color: var(--primary); }
        p { color: var(--text-dim); margin-bottom: 30px; font-size: 16px; line-height: 1.5; }
        .details-box { background: #000; padding: 20px; border-radius: 15px; margin-bottom: 30px; text-align: left; border: 1px dashed #333; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .detail-label { color: var(--text-dim); }
        .detail-value { font-weight: 600; color: #fff; }
        .whatsapp-btn { background: #25D366; color: #fff; padding: 18px; border-radius: 15px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; transition: 0.3s; }
        .whatsapp-btn:hover { background: #20ba5a; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-box">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1>Paiement Confirmé !</h1>
        <p>Merci pour votre achat. Votre transaction a été traitée avec succès. Cliquez ci-dessous pour recevoir votre code d'accès.</p>
        
        <div class="details-box">
            <div class="detail-item"><span class="detail-label">Abonnement :</span> <span class="detail-value" id="planName">Premium</span></div>
            <div class="detail-item"><span class="detail-label">Référence :</span> <span class="detail-value" id="orderRef">...</span></div>
        </div>

        <a href="#" id="whatsappBtn" class="whatsapp-btn">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
            Recevoir mon code sur WhatsApp
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'Premium';
        const ref = urlParams.get('session_id') || 'REF-STRIPE';
        const email = urlParams.get('email') || '';
        
        document.getElementById('planName').textContent = plan;
        document.getElementById('orderRef').textContent = ref.substring(0, 15) + '...';
        
        const message = `Bonjour, je viens de payer mon abonnement Neo4k Pro.\n\nPlan: ${plan}\nEmail: ${email}\nRéférence: ${ref}\n\nMerci de m'envoyer mon code d'accès.`;
        document.getElementById('whatsappBtn').href = `https://wa.me/213564653328?text=${encodeURIComponent(message)}`;
    </script>
</body>
</html>
