<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo 4K Pro — Paiement Sécurisé</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-2: #27272a;
            --primary: #FACC15;
            --primary-hover: #EAB308;
            --text: #FFFFFF;
            --text-dim: #A1A1AA;
            --border: #3F3F46;
            --green: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        
        .payment-container {
            max-width: 500px;
            width: 95%;
            margin: 60px auto;
            padding: 20px;
        }
        
        .logo { font-size: 28px; font-weight: 800; color: var(--primary); text-align: center; margin-bottom: 40px; letter-spacing: -1px; }
        
        .payment-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .plan-info { text-align: center; margin-bottom: 30px; }
        .plan-title { font-size: 20px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
        .plan-price { font-size: 48px; font-weight: 800; color: var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-dim); }
        .form-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.1); }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: var(--primary);
            color: #000;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .secure-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--text-dim);
            font-size: 13px;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--primary); }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="logo">NEO 4K PRO</div>
        <div class="payment-card">
            <div class="plan-info">
                <div class="plan-title" id="planTitle">Chargement...</div>
                <div class="plan-price" id="planPrice">—</div>
            </div>
            
            <div class="form-group">
                <label>Votre Email</label>
                <input type="email" id="email" placeholder="exemple@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Numéro WhatsApp</label>
                <input type="tel" id="whatsapp" placeholder="+213 5XX XXX XXX" required>
            </div>
            
            <button class="submit-btn" id="payBtn" onclick="handlePayment()">
                <span id="btnText">Payer par Carte</span>
                <div class="loader" id="loader"></div>
            </button>
            
            <div class="secure-notice">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>
                Paiement 100% sécurisé par Stripe
            </div>
            
            <a href="index.html" class="back-link">← Retour aux offres</a>
        </div>
    </div>
    
    <footer>
        &copy; 2026 Neo 4K Pro — Service Premium Digital
    </footer>

    <script>
        const stripe = Stripe('pk_live_51U0IKgFi4Tntcp2QpXqBoXC313ozanl3UhH9ymftnuXfhiJnsvKca7ind4AIt6uS9xU04VMiSZ9KRQ3H9GEArjcH00lNVkClzk');
        const BACKEND_URL = "https://neo4k-final.onrender.com";
        
        const urlParams = new URLSearchParams(window.location.search);
        const planId = urlParams.get('plan');
        const planLabel = urlParams.get('label');
        const prices = { '1mois': '10€', '3mois': '20€', '6mois': '30€', '12mois': '45€' };

        if (planId && prices[planId]) {
            document.getElementById('planTitle').textContent = planLabel || "Votre abonnement";
            document.getElementById('planPrice').textContent = prices[planId];
        }

        async function handlePayment() {
            const email = document.getElementById('email').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            
            if (!email || !email.includes('@')) return alert("Veuillez entrer un email valide.");
            if (!whatsapp) return alert("Veuillez entrer votre numéro WhatsApp.");

            const btn = document.getElementById('payBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch(`${BACKEND_URL}/create-checkout-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ planId, email, whatsapp })
                });
                
                const session = await response.json();
                if (session.url) {
                    window.location.href = session.url;
                } else {
                    throw new Error(session.error || "Erreur lors de la création de la session");
                }
            } catch (err) {
                alert("Erreur : " + err.message);
                btn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
