<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Neo 4K Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13; --surface:#121828; --border:#242C42;
    --text:#E9EDF5; --text-dim:#8C97AE;
    --cyan:#2DD4A7; --violet:#16A97C;
    --grad: linear-gradient(120deg, var(--cyan), var(--violet));
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .card{
    max-width:480px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:48px 32px;
  }
  .icon{
    width:72px; height:72px; margin:0 auto 24px; border-radius:50%;
    background:var(--grad); display:flex; align-items:center; justify-content:center;
    font-size:34px; color:#06110F;
  }
  h1{font-family:'Unbounded',sans-serif; font-size:26px; margin-bottom:14px; letter-spacing:-.5px;}
  p{color:var(--text-dim); font-size:15.5px; line-height:1.6; margin-bottom:8px;}
  .highlight{color:var(--cyan); font-weight:600;}
  a.btn{
    display:inline-block; margin-top:26px; background:var(--grad); color:#06110F;
    font-weight:700; padding:14px 28px; border-radius:10px; text-decoration:none; font-size:15px;
    width: 100%;
  }
  .wa-btn {
    background: #25D366;
    color: white;
    border: none;
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
  }
  .wa-btn:hover {
    background: #20ba5a;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Paiement confirmé</h1>
    <p>Merci pour votre confiance ! Votre commande est en cours de traitement.</p>
    <p><span class="highlight">Important :</span> Cliquez sur le bouton ci-dessous pour nous envoyer votre preuve de paiement et recevoir vos accès immédiatement sur WhatsApp.</p>
    
    <a class="btn wa-btn" href="https://wa.me/213564653328?text=Bonjour%2C%20je%20viens%20de%20payer%20mon%20abonnement%20Streaming%20Pro.%20Voici%20mon%20email%20de%20paiement%20%3A%20">
      Recevoir mes accès sur WhatsApp 💬
    </a>
    
    <a class="btn" href="/" style="background: transparent; color: var(--text-dim); border: 1px solid var(--border); margin-top: 15px;">
      Retour à l'accueil
    </a>
  </div>
</body>
</html>
