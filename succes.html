<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reçu de Paiement — Neo 4K Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 24px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .receipt-box { background: white; color: #0f172a; border-radius: 16px; padding: 20px; margin: 20px 0; text-align: left; position: relative; }
        .receipt-box::after { content: ''; position: absolute; bottom: -10px; left: 10%; right: 10%; height: 20px; background: radial-gradient(circle, transparent, transparent 50%, white 50%, white); background-size: 20px 20px; transform: rotate(180deg); }
        .btn-whatsapp { background: #25d366; color: white; padding: 15px; border-radius: 12px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s ease; width: 100%; border: none; cursor: pointer; }
        .btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); }
        .input-email { background: #f8fafc; border: 2px solid #cbd5e1; color: #0f172a; padding: 12px; border-radius: 12px; width: 100%; margin-top: 5px; font-size: 15px; outline: none; font-weight: 600; }
        .input-email:focus { border-color: #38bdf8; background: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="text-green-500 text-5xl mb-4"><i class="fas fa-check-circle"></i></div>
        <h1 class="text-2xl font-bold mb-2">Paiement Confirmé !</h1>
        <p class="text-slate-400 text-sm mb-6">Merci pour votre achat. Voici votre reçu numérique :</p>
        
        <div class="receipt-box shadow-inner">
            <div class="flex justify-between border-bottom border-slate-200 pb-2 mb-2">
                <span class="text-xs font-bold text-slate-400 uppercase">Service</span>
                <span class="text-xs font-bold text-sky-600">NEO 4K PRO</span>
            </div>
            <div class="mb-3">
                <p class="text-xs text-slate-400 uppercase font-bold">Email du client</p>
                <input type="email" id="final-email" class="input-email" placeholder="Entrez votre email ici...">
            </div>
            <div class="mb-3">
                <p class="text-xs text-slate-400 uppercase font-bold">Référence Transaction</p>
                <p id="ref-id" class="font-mono text-xs break-all font-bold text-slate-600">Chargement...</p>
            </div>
            <div class="flex justify-between mb-2">
                <span class="text-sm font-semibold">Plan choisi</span>
                <span id="plan-name" class="font-bold text-sm text-sky-600">Chargement...</span>
            </div>
            <div class="flex justify-between mb-2">
                <span class="text-sm font-semibold">Statut</span>
                <span class="text-green-600 font-bold text-sm">Payé ✓</span>
            </div>
            <div class="border-t border-dashed border-slate-300 my-3"></div>
        </div>

        <p class="text-sm mb-6 text-slate-300">Entrez votre email ci-dessus puis cliquez pour recevoir vos codes.</p>

        <button id="wa-btn" class="btn-whatsapp">
            <i class="fab fa-whatsapp text-2xl"></i>
            ENVOYER SUR WHATSAPP
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id') || 'REF-LIVE-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        const planId = urlParams.get('plan') || '1mois';
        const rawEmail = urlParams.get('email');

        const plans = { "1mois": "1 Mois", "3mois": "3 Mois", "6mois": "6 Mois", "12mois": "12 Mois" };
        const planDisplay = plans[planId] || "Neo 4K Pro";

        document.getElementById('ref-id').innerText = sessionId;
        document.getElementById('plan-name').innerText = planDisplay;

        // If email exists in URL and is valid, pre-fill it
        if (rawEmail && rawEmail.includes('@') && rawEmail !== 'Client Stripe') {
            document.getElementById('final-email').value = rawEmail;
        }

        document.getElementById('wa-btn').addEventListener('click', function() {
            const email = document.getElementById('final-email').value.trim();
            
            if (!email || !email.includes('@')) {
                alert("Veuillez entrer un email valide.");
                return;
            }

            const message = `Bonjour, je viens de payer mon abonnement Neo 4K Pro.\n\n📄 *REÇU DE PAIEMENT*\n━━━━━━━━━━━━━━━\n🔹 Email : <LaTex>{email}\n🔹 Plan :</LaTex>{planDisplay}\n🔹 Référence : <LaTex>{sessionId}\n━━━━━━━━━━━━━━━\nMerci de m'envoyer mes codes d'accès.`;                          window.location.href = `https://wa.me/213564653328?text=</LaTex>{encodeURIComponent(message)}`;
        });
    </script>
</body>
</html>
