<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reçu Neo 4K Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; border: 1px solid #334155; }
        .receipt { background: white; color: #0f172a; border-radius: 12px; padding: 20px; margin: 20px 0; text-align: left; }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; display: block; cursor: pointer; border: none; text-decoration: none; }
        .input-email { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e2e8f0; margin-top: 5px; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-2xl font-bold text-green-500 mb-4">Paiement Réussi !</h1>
        <div class="receipt">
            <p style="font-size: 12px; color: #64748b; font-weight: bold;">EMAIL DU CLIENT :</p>
            <input type="email" id="userEmail" class="input-email" placeholder="Votre email ici...">
            
            <div style="margin-top: 15px;">
                <p style="font-size: 12px; color: #64748b; font-weight: bold;">RÉFÉRENCE :</p>
                <p id="refId" style="font-family: monospace; font-size: 12px; word-break: break-all;"></p>
            </div>
            
            <div style="margin-top: 15px;">
                <p style="font-size: 12px; color: #64748b; font-weight: bold;">PLAN :</p>
                <p id="planName" style="font-weight: bold; color: #0284c7;"></p>
            </div>
        </div>
        <button onclick="sendToWhatsApp()" class="btn-wa">ENVOYER SUR WHATSAPP</button>
    </div>

    <script>
        // استخراج البيانات من الرابط
        var params = new URLSearchParams(window.location.search);
        var session = params.get('session_id') || "REF-" + Math.floor(Math.random()*1000000);
        var plan = params.get('plan') || "1mois";
        var email = params.get('email') || "";

        // عرض البيانات
        document.getElementById('refId').innerText = session;
        document.getElementById('planName').innerText = "Abonnement " + plan;
        if(email && email !== "Client Stripe") {
            document.getElementById('userEmail').value = email;
        }

        function sendToWhatsApp() {
            var inputEmail = document.getElementById('userEmail').value.trim();
            if(!inputEmail || inputEmail.indexOf('@') === -1) {
                alert("Veuillez entrer un email valide.");
                return;
            }

            // بناء الرسالة بطريقة بسيطة جداً
            var text = "Bonjour, je viens de payer mon abonnement Neo 4K Pro.\n\n" +
                       "*REÇU DE PAIEMENT*\n" +
                       "Email : " + inputEmail + "\n" +
                       "Plan : " + plan + "\n" +
                       "Référence : " + session + "\n\n" +
                       "Merci de m'envoyer mes codes d'accès.";

            var waUrl = "https://wa.me/213564653328?text=" + encodeURIComponent(text);
            window.location.href = waUrl;
        }
    </script>
</body>
</html>
